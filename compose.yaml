x-app-env: &app_env
  APP_MODE: demo
  DATABASE_URL: postgresql+psycopg://fsp:demo_change_before_real_deploy@db:5432/fsp_signal
  PUBLIC_BASE_URL: http://127.0.0.1:${FSP_WEB_PORT:-8080}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_FROM: demo@example.test
  FSP_PROVIDER: mock
  SESSION_SECURE: "false"

services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: demo_change_before_real_deploy
      POSTGRES_DB: fsp_signal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp_signal"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      <<: *app_env
      FRONTIERAI_BASE_URL: ${FRONTIERAI_BASE_URL:-https://gateway.frontierai.ru/v1/chat/completions}
      FRONTIERAI_MODEL: ${FRONTIERAI_MODEL:-qwen3.8-27b-4a100}
      FRONTIERAI_API_KEY: ${FRONTIERAI_API_KEY:-}
      AI_ASSISTANT_MAX_INPUT_CHARS: ${AI_ASSISTANT_MAX_INPUT_CHARS:-2000}
      AI_ASSISTANT_MAX_OUTPUT_TOKENS: ${AI_ASSISTANT_MAX_OUTPUT_TOKENS:-800}
      AI_ASSISTANT_TIMEOUT_SECONDS: ${AI_ASSISTANT_TIMEOUT_SECONDS:-30}
      TRANSCRIPTION_API_URL: ${TRANSCRIPTION_API_URL:-}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    command: ["python", "-m", "backend.mail_worker"]
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    command: ["alembic", "upgrade", "head"]
    environment: *app_env
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    ports:
      - "127.0.0.1:${FSP_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
